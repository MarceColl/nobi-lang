name: spec

on:
  pull_request:
    paths:
      - "spec/**"
      - "lib/nobi/lang/**"
      - "lib/nobi/exec/**"
      - "test/support/spec/**"
      - ".github/workflows/spec.yml"
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "lib/nobi/lang/**"
      - "lib/nobi/exec/**"
      - "test/support/spec/**"
      - ".github/workflows/spec.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain download from releases.lean-lang.org fails now and then
      # (TLS connect errors), and lean-action does not retry it: install elan
      # and the pinned toolchain here, with retries, so lean-action finds it.
      - name: Install elan and the pinned Lean toolchain
        run: |
          curl -sSfL --retry 5 https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for attempt in 1 2 3 4 5; do
            "$HOME/.elan/bin/elan" toolchain install "$(cat spec/lean/lean-toolchain)" && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      # Uses the toolchain in spec/lean/lean-toolchain through elan, caches
      # .lake, then runs `lake build` and `lake test` (every #guard, the
      # VERSION check).
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: spec/lean
          build: true
          test: true
          use-mathlib-cache: false

      - name: nobi-ref prints the spec version
        working-directory: spec/lean
        run: test "$(.lake/build/bin/nobi-ref version)" = "$(cat VERSION)"

      - name: nobi-ref lists the stdlib primitives
        working-directory: spec/lean
        run: .lake/build/bin/nobi-ref prims | jq -e 'length >= 47'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nobi-ref
          path: spec/lean/.lake/build/bin/nobi-ref
          if-no-files-found: error
