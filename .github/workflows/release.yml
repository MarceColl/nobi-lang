name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Burrito cross-compiles every target from one host.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Must match the OTP the ERTS pins in lib/mix/tasks/kinoko.dist.ex cover.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.3"

      - name: Install Zig 0.16.0 (checksum verified)
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
        run: |
          set -euo pipefail
          archive="zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install xz
        run: brew install xz

      - run: mix deps.get

      - name: Build every target
        run: |
          zig version
          # The 12-character short id, as local builds stamp it (Kinoko.Build).
          KINOKO_COMMIT="${GITHUB_SHA:0:12}" mix kinoko.dist

      - name: Smoke test the host binary
        run: |
          ls -l dist
          chmod +x dist/kinoko-macos-arm64
          dist/kinoko-macos-arm64 version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      # The repo file keeps the OWNER/kinoko placeholder; the published copy
      # names this repository, so `curl | sh` works from the release.
      - name: Stamp the repository into install.sh
        run: |
          set -euo pipefail
          mkdir -p release
          sed "s|OWNER/kinoko|$GITHUB_REPOSITORY|" install.sh > release/install.sh
          grep -q "KINOKO_REPO:-$GITHUB_REPOSITORY}" release/install.sh
          ! grep -q "OWNER/" release/install.sh

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* release/install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
