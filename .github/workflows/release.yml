name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Burrito cross-compiles every target from one host.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Must match the OTP the ERTS pins in lib/mix/tasks/kinoko.dist.ex cover.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.3"

      - name: Install Zig 0.16.0 (checksum verified)
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
        run: |
          set -euo pipefail
          archive="zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Install xz
        run: brew install xz

      - run: mix deps.get

      - name: Build every target
        env:
          KINOKO_COMMIT: ${{ github.sha }}
        run: |
          zig version
          mix kinoko.dist

      - name: Smoke test the host binary
        run: |
          ls -l dist
          chmod +x dist/kinoko-macos-arm64
          dist/kinoko-macos-arm64 version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
