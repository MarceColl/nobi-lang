name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "lib/mix/tasks/site.*"
      - "priv/static/fonts/**"
      - "assets/css/app.css"
      - "mix.exs"
      - "mix.lock"
      - "config/config.exs"
      - "lib/nobi/lang/**"
      - "test/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolchain as release.yml.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28.1.1"
          elixir-version: "1.19.3"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: pages-${{ runner.os }}-otp28.1.1-ex1.19.3-${{ hashFiles('mix.lock') }}
          restore-keys: pages-${{ runner.os }}-otp28.1.1-ex1.19.3-

      - run: mix deps.get

      # A sample that stops compiling must block the deploy. Needs no services:
      # the test alias creates and migrates the SQLite file at .nobi/test.db.
      # test/site also fetches the Tailwind binary on first use.
      - name: Test the samples
        run: mix test test/site
        env:
          MIX_ENV: test

      - name: Build the site
        run: mix site.build
        env:
          NOBI_REPO: ${{ github.repository }}

      # Same guard as release.yml: never publish the placeholder repository.
      - name: Refuse the OWNER/nobi-lang placeholder
        run: |
          if grep -q 'OWNER/' site/dist/index.html; then
            echo "site/dist/index.html still contains OWNER/" >&2
            exit 1
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
